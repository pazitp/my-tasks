# סימון פריטים ברשימת הקניות כ"נקנו" מבחוץ (למשל על ידי קלוד אחרי שהוסיף אותם לעגלה בטיב טעם).
# הפעלה: פתיחת issue שכותרתו מתחילה ב-"נקנה:" (רק מהחשבון pazitp), למשל:
#   נקנה: אפונה, קפה נמס
# אפשר גם לרשום פריטים נוספים בגוף ה-issue, אחד בכל שורה או מופרדים בפסיקים.
# הפריטים רק מסומנים ב-V; המחיקה הסופית נעשית באפליקציה אחרי שהמשלוח הגיע.
name: mark-bought

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  mark:
    runs-on: ubuntu-latest
    if: >-
      github.event.issue.user.login == 'pazitp' &&
      startsWith(github.event.issue.title, 'נקנה:')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin@12 --no-save --no-audit --no-fund
        working-directory: scripts
      - run: node mark-bought.js
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: תגובה וסגירת ה-issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$RESULT_COMMENT" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$RESULT_COMMENT"
          else
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "✖ הסימון נכשל — ראו את הלוג: $RUN_URL"
          fi
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
